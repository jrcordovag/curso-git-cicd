name: CI/CD Multientorno - Staging y Producción

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # 1. INTEGRACIÓN CONTINUA (CI)
  # ==========================================
  ci-y-publicacion:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Generar tag corto de Git
        id: vars
        run: echo "short_sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Linter de Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar imagen para pruebas
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mi-flask-app:test

      - name: Escáner Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-flask-app:test'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Se publica la imagen solo en pushes a develop o main
      - name: Autenticación en GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ steps.vars.outputs.short_sha }}

      - name: Publicar Imagen en GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ==========================================
  # 2. DESPLIEGUE A STAGING (Desde rama develop)
  # ==========================================
  cd-staging:
    needs: ci-y-publicacion
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging # Asocia las variables del entorno "staging"

    steps:
      - name: Autenticación en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar contenedor en Staging
        run: |
          TAG="${{ needs.ci-y-publicacion.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:$TAG"

          docker run -d \
            --name app-staging \
            -p 5000:5000 \
            -e ENVIRONMENT_NAME="${{ vars.ENVIRONMENT_NAME }}" \
            $IMAGE_NAME

          sleep 3

      - name: Validar Health Check Staging
        run: |
          echo "Verificando respuesta del entorno Staging..."
          curl -s http://localhost:5000/
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$HTTP_STATUS" -ne 200 ]; then exit 1; fi

      - name: Limpieza
        if: always()
        run: docker rm -f app-staging || true

  # ==========================================
  # 3. DESPLIEGUE A PRODUCCIÓN (Desde rama main)
  # ==========================================
  cd-produccion:
    needs: ci-y-publicacion
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production # Asocia variables de "production" y activa la revisión manual

    steps:
      - name: Autenticación en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Iniciar contenedor en Producción
        run: |
          TAG="${{ needs.ci-y-publicacion.outputs.image_tag }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}:$TAG"

          docker run -d \
            --name app-produccion \
            -p 5000:5000 \
            -e ENVIRONMENT_NAME="${{ vars.ENVIRONMENT_NAME }}" \
            $IMAGE_NAME

          sleep 3

      - name: Validar Health Check Producción
        run: |
          echo "Verificando respuesta del entorno Producción..."
          curl -s http://localhost:5000/
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health)
          if [ "$HTTP_STATUS" -ne 200 ]; then exit 1; fi

      - name: Limpieza
        if: always()
        run: docker rm -f app-produccion || true
